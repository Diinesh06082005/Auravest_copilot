services:
  # ==========================================
  # 1. Backend Service (NodeJS)
  # ==========================================
  - type: web
    name: copilot-backend-service
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Must be provided by user (e.g. MongoDB Atlas connection string)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*" # Update with final frontend domain in production
      - key: FMP_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # ==========================================
  # 2. Frontend Service (Vite Static Site)
  # ==========================================
  - type: web
    name: copilot-frontend-web
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: copilot-backend-service
          type: web
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
